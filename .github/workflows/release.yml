name: Build & Release (Windows)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies (engine)
        run: |
          python -m pip install --upgrade pip
          pip install -r build_engine/requirements.txt

      - name: Download Vosk model (en-us)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "models" | Out-Null
          if (!(Test-Path "models/model-en-us")) {
            Write-Host "Downloading Vosk model..."
            Invoke-WebRequest -Uri "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" -OutFile "vosk-model.zip"
            Expand-Archive -Path "vosk-model.zip" -DestinationPath "models" -Force
            Remove-Item "vosk-model.zip" -Force
            Rename-Item "models/vosk-model-small-en-us-0.15" "models/model-en-us"
          }
          if (!(Test-Path "models/model-en-us")) { throw "Vosk model folder not found after download." }
          Get-ChildItem "models/model-en-us" | Select-Object -First 5

      - name: Build Python engine (PyInstaller)
        run: npm run build_engine

      - name: Build Electron installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
