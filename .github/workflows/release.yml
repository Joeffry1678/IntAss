name: Build & Release (Windows)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies (engine)
        run: |
          python -m pip install --upgrade pip
          pip install -r build_engine/requirements.txt

      - name: Download Vosk model (en-us)
        shell: pwsh
        run: |
          $modelsDir = "models"
          $targetDir = "models/model-en-us"
          $zipPath = "vosk-model.zip"

          New-Item -ItemType Directory -Force -Path $modelsDir | Out-Null

          if (!(Test-Path $targetDir)) {

            Write-Host "Downloading Vosk model..."
            Invoke-WebRequest `
              -Uri "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" `
              -OutFile $zipPath

            Expand-Archive -Path $zipPath -DestinationPath $modelsDir -Force
            Remove-Item $zipPath -Force

            $extracted = Join-Path $modelsDir "vosk-model-small-en-us-0.15"

            if (Test-Path $extracted) {
              if (Test-Path $targetDir) {
                Remove-Item -Recurse -Force $targetDir
              }
              Move-Item -Path $extracted -Destination $targetDir
            } else {
              throw "Extracted Vosk folder not found."
            }
          }

          if (!(Test-Path $targetDir)) {
            throw "Vosk model folder missing after setup."
          }

          Write-Host "Vosk model ready."


      - name: Build Python engine (PyInstaller)
        run: npm run build_engine

      - name: Build Electron installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
